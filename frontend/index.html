    <script>
      // Apply the saved theme before first paint (no flash). Light is the default.
      (function () {
        var t = "light";
        try { if (localStorage.getItem("exfil-theme") === "dark") t = "dark"; } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
